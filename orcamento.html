<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fratertec - Orçamento</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { 
            --bg-dark: #0A192F; 
            --bg-card: #112240; 
            --accent-blue: #00D2FF; 
            --text-light: #F8FAFC; 
            --text-subtle: #CBD5E1; 
        }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar { 
            background-color: rgba(10, 25, 47, 0.95); 
            border-bottom: 1px solid rgba(0, 210, 255, 0.2); 
            backdrop-filter: blur(10px);
        }
        .brand-highlight { color: var(--accent-blue); }
        .text-subtle { color: var(--text-subtle) !important; }
        
        .card-custom { 
            background-color: var(--bg-card); 
            border: 1px solid rgba(0, 210, 255, 0.2); 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .form-control, .form-select {
            background-color: #0A192F !important;
            color: var(--text-light) !important;
            border: 1px solid rgba(0, 210, 255, 0.2) !important;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25) !important;
        }

        .form-control::placeholder {
            color: #64748B !important;
        }

        .btn-custom { 
            background-color: var(--accent-blue); 
            color: #0A192F; 
            font-weight: 600; 
            transition: all 0.2s ease;
        }

        .btn-custom:hover {
            background-color: #33e0ff;
            color: #0A192F;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-cpu text-info me-2"></i>FRATER<span class="brand-highlight">TEC</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="projeto-social.html">Projeto Social</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-info" href="orcamento.html">Orçamento</a></li>
                    <li class="nav-item"><a class="nav-link ms-2 btn btn-outline-info text-info px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- FORMULÁRIO -->
    <main class="container pt-5 mt-5 pb-5 flex-grow-1">
        <div class="row justify-content-center py-4">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <h1 class="fw-bold">Solicite um <span class="brand-highlight">Orçamento</span></h1>
                    <p class="text-subtle fs-5">Preencha as informações do seu projeto e entraremos em contato rapidamente.</p>
                </div>

                <form class="card p-4 p-md-5 card-custom" id="formOrcamento" onsubmit="event.preventDefault(); enviarOrcamento();">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-light fw-medium">Nome Completo <span class="text-info">*</span></label>
                            <input type="text" id="nome" class="form-control" placeholder="Digite seu nome" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light fw-medium">E-mail <span class="text-info">*</span></label>
                            <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light fw-medium">Telefone / WhatsApp <span class="text-info">*</span></label>
                            <input type="tel" id="whatsapp" class="form-control" placeholder="(11) 99999-9999" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-light fw-medium">Serviço de Interesse <span class="text-info">*</span></label>
                            <select id="servicoSelect" class="form-select" required>
                                <option value="" selected disabled>Selecione um serviço...</option>
                                <option value="Presença Digital & Tags NFC">Presença Digital & Tags NFC</option>
                                <option value="CFTV & Segurança Eletrônica">CFTV & Segurança Eletrônica</option>
                                <option value="FinBot - Gestão Financeira">FinBot - Gestão Financeira</option>
                                <option value="Sistema PDV para Ademas">Sistema PDV para Adegas</option>
                                <option value="Automação de Atendimento">Automação de Atendimento</option>
                                <option value="Soluções Personalizadas">Soluções Personalizadas</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-light fw-medium">Descrição do Projeto / Necessidade</label>
                            <textarea id="mensagem" class="form-control" rows="4" placeholder="Conte um pouco sobre o que precisa ou sobre seu negócio..."></textarea>
                        </div>

                        <!-- Checkbox LGPD -->
                        <div class="col-12 mt-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="lgpdCheck" required>
                                <label class="form-check-label text-subtle small" for="lgpdCheck">
                                    Concordo com o processamento dos meus dados para contato de acordo com a <a href="politica-de-privacidade.html" target="_blank" class="brand-highlight text-decoration-none">Política de Privacidade</a>.
                                </label>
                            </div>
                        </div>

                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-custom btn-lg w-100 py-3 fs-6">
                                <i class="bi bi-send-fill me-2"></i>Enviar Solicitação de Orçamento
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Função de envio temporária (será ligada à API do C# no futuro)
        function enviarOrcamento() {
            const nome = document.getElementById('nome').value;
            alert(`Obrigado, ${nome}! Sua solicitação foi recebida. Entraremos em contato em breve.`);
            document.getElementById('formOrcamento').reset();
        }

        // Seleção automática do serviço se passado via parâmetro na URL (?servico=finbot)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const servicoParam = urlParams.get('servico');
            if (servicoParam) {
                const select = document.getElementById('servicoSelect');
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value.toLowerCase().includes(servicoParam.toLowerCase())) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }
        });
    </script>
</body>
</html>

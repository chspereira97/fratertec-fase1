<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fratertec - Acesse sua Conta</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root { 
            --bg-dark: #0A192F; 
            --bg-card: #1E293B; 
            --accent-blue: #00D2FF; 
            --text-light: #F8FAFC; 
            --text-subtle: #CBD5E1; 
            --placeholder-color: #94A3B8;
        }
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar { 
            background-color: rgba(10, 25, 47, 0.95); 
            border-bottom: 1px solid rgba(0, 210, 255, 0.2); 
            backdrop-filter: blur(10px);
        }
        .brand-highlight { 
            color: var(--accent-blue); 
        }
        .text-subtle {
            color: var(--text-subtle) !important;
        }
        
        /* Card Central de Autenticação */
        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 480px;
            width: 100%;
        }

        /* Nav Tabs Estilizadas */
        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-tabs .nav-link {
            color: var(--text-subtle);
            border: none;
            font-weight: 600;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link:hover {
            color: var(--accent-blue);
            border: none;
        }
        .nav-tabs .nav-link.active {
            color: var(--accent-blue);
            background-color: transparent;
            border: none;
            border-bottom: 2px solid var(--accent-blue);
        }

        /* Form Controls - Texto e Placeholder Clareados */
        .form-control {
            background-color: #0F172A;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-light) !important;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .form-control::placeholder {
            color: var(--placeholder-color) !important;
            opacity: 1;
        }
        .form-control:focus {
            background-color: #0F172A;
            border-color: var(--accent-blue);
            color: var(--text-light) !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        /* Botão Acessar */
        .btn-custom {
            background-color: var(--accent-blue);
            color: #0A192F;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #00b8e6;
            color: #0A192F;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Botão WhatsApp Fast-Track */
        .btn-whatsapp {
            background-color: #25D366;
            color: #FFFFFF;
            font-weight: 600;
            border: none;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-whatsapp:hover {
            background-color: #1EBE5D;
            color: #FFFFFF;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>

    <!-- Menu de Navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-cpu text-info me-2"></i>FRATER<span class="brand-highlight">TEC</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="projeto-social.html">Projeto Social</a></li>
                    <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Orçamento</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Central -->
    <main class="container d-flex align-items-center justify-content-center flex-grow-1 pt-5 mt-5 pb-5">
        <div class="auth-card p-4 p-md-5">
            
            <div class="text-center mb-4">
                <h2 class="h4 fw-bold">Acesse a <span class="brand-highlight">Plataforma</span></h2>
                <p class="small text-subtle">Entre com sua conta para solicitar orçamentos e acompanhar chamados</p>
            </div>

            <!-- Abas (Login / Cadastro) -->
            <ul class="nav nav-tabs nav-justified mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Entrar</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Criar Conta</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">
                
                <!-- ABA 1: LOGIN -->
                <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form action="contato.html" method="GET">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label small text-subtle">E-mail</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="seuemail@exemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label small text-subtle">Senha</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-subtle" for="rememberMe">Lembrar de mim</label>
                            </div>
                            <a href="#" class="small brand-highlight text-decoration-none">Esqueceu a senha?</a>
                        </div>
                        <button type="submit" class="btn btn-custom w-100">
                            Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
                        </button>
                    </form>
                </div>

                <!-- ABA 2: CADASTRO -->
                <div class="tab-pane fade" id="register" role="tabpanel">
                    <form action="login.html" method="GET">
                        <div class="mb-3">
                            <label for="regName" class="form-label small text-subtle">Nome Completo</label>
                            <input type="text" class="form-control" id="regName" placeholder="Seu nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label small text-subtle">E-mail</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="seuemail@exemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPhone" class="form-label small text-subtle">WhatsApp / Telefone</label>
                            <input type="tel" class="form-control" id="regPhone" placeholder="(11) 99999-9999" required>
                        </div>
                        <div class="mb-4">
                            <label for="regPassword" class="form-label small text-subtle">Senha</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Crie uma senha segura" required>
                        </div>
                        <button type="submit" class="btn btn-custom w-100">
                            Cadastrar e Continuar <i class="bi bi-person-plus ms-1"></i>
                        </button>
                    </form>
                </div>

            </div>

            <hr class="my-4 border-secondary opacity-25">

            <!-- Fast-Track via WhatsApp -->
            <div class="text-center">
                <p class="small text-subtle mb-2">Sem tempo para se cadastrar agora?</p>
                <a href="https://wa.me/5511999999999?text=Olá!%20Gostaria%20de%20solicitar%20um%20orçamento%20direto." target="_blank" class="btn btn-whatsapp w-100">
                    <i class="bi bi-whatsapp me-2"></i>Orçamento Rápido via WhatsApp
                </a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
